<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #14151a; color: #e8e9ec;
           font-family: 'IBM Plex Sans', system-ui, sans-serif;
           -webkit-font-smoothing: antialiased; }
    a { color: #d99a4e; } a:hover { color: #e8b473; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    .cap { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase;
           font-weight: 500; color: #6b7280; }
  </style>
</helmet>

<div style="width: 375px; min-height: 812px; background: #14151a; display: flex; flex-direction: column;">

  <header style="padding: 24px 20px 18px; border-bottom: 1px solid #24272f; display: flex; flex-direction: column; gap: 5px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
      <h1 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.015em; color: #e8e9ec;">Flashcards</h1>
      <span class="mono" style="font-size: 11px; color: #6b7280;">gemini-2.5-flash</span>
    </div>
    <p style="margin: 0; font-size: 13px; color: #9ba1ac; line-height: 1.45;">Notes in, Anki cards out.</p>
  </header>

  <section style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 9px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <span class="cap">Notes</span>
      <span class="mono" style="font-size: 11px; color: #4d535c;">0 chars</span>
    </div>
    <div style="background: #1a1c22; border: 1px dashed #2e323b; border-radius: 8px; padding: 14px 15px; height: 176px; font-size: 13.5px; line-height: 1.6; color: #575d67;">Paste lecture notes here…</div>
  </section>

  <section style="padding: 14px 20px 0;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 48px; padding: 0 15px; background: #1a1c22; border: 1px solid #2a2d35; border-radius: 8px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"></path><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"></path></svg>
        <span style="font-size: 13.5px; color: #9ba1ac;">Upload .md or .txt</span>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
    </div>
  </section>

  <section style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 1px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 10px 15px; background: #1a1c22; border: 1px solid #2a2d35; border-radius: 8px 8px 0 0;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 13.5px; color: #7c828c;">Max chunks</span>
        <span style="font-size: 11.5px; color: #575d67;">Caps API calls</span>
      </div>
      <div style="display: flex; align-items: center; gap: 2px; background: #1e2027; border: 1px solid #2a2d35; border-radius: 7px; padding: 2px;">
        <div style="width: 40px; height: 36px; display: flex; align-items: center; justify-content: center; color: #4d535c; font-size: 17px;">−</div>
        <div class="mono" style="min-width: 34px; text-align: center; font-size: 15px; font-weight: 500; color: #7c828c;">5</div>
        <div style="width: 40px; height: 36px; display: flex; align-items: center; justify-content: center; color: #4d535c; font-size: 17px;">+</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 10px 15px; background: #1a1c22; border: 1px solid #2a2d35; border-top: none; border-radius: 0 0 8px 8px;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 13.5px; color: #7c828c;">Remove near-duplicates</span>
        <span style="font-size: 11.5px; color: #575d67;">Adds ~25s on first run</span>
      </div>
      <div style="width: 46px; height: 28px; border-radius: 14px; background: #2a2d35; display: flex; align-items: center; justify-content: flex-end; padding: 3px;">
        <div style="width: 22px; height: 22px; border-radius: 11px; background: #14151a;"></div>
      </div>
    </div>
  </section>

  <div style="flex-grow: 1;"></div>

  <section style="padding: 20px; display: flex; flex-direction: column; gap: 10px;">
    <div style="height: 48px; border-radius: 8px; border: 1px solid #2a2d35; background: #191b21; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <span style="font-size: 14.5px; font-weight: 500; color: #575d67;">Preview</span>
      <span class="mono" style="font-size: 11px; color: #4d535c;">free</span>
    </div>
    <div style="height: 52px; border-radius: 8px; background: #2a2620; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 15px; font-weight: 600; color: #6b6152;">Generate</span>
    </div>
    <p style="margin: 2px 0 0; text-align: center; font-size: 11.5px; color: #575d67;">Add notes to continue</p>
  </section>

</div>
</x-dc>
</body>
</html>
