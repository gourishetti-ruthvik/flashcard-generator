<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #14151a; color: #e8e9ec;
           font-family: 'IBM Plex Sans', system-ui, sans-serif;
           -webkit-font-smoothing: antialiased; }
    a { color: #d99a4e; } a:hover { color: #e8b473; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    .cap { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase;
           font-weight: 500; color: #6b7280; }
  </style>
</helmet>

<div style="width: 375px; min-height: 700px; background: #14151a; display: flex; flex-direction: column;">

  <header style="padding: 24px 20px 18px; border-bottom: 1px solid #24272f; display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
    <h1 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.015em; color: #e8e9ec;">Flashcards</h1>
    <span class="mono" style="font-size: 11px; color: #8a6455;">not configured</span>
  </header>

  <section style="padding: 20px 20px 0;">
    <div style="border: 1px solid #4a352e; background: #221a17; border-radius: 10px; padding: 15px 16px;">
      <div style="display: flex; align-items: flex-start; gap: 11px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#c47f66" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><path d="M15 7a4 4 0 1 1-3.5 5.9L7 17.4V21H3v-4l6.1-6.1A4 4 0 0 1 15 7z"></path><path d="M16.5 10.5h.01"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 14.5px; font-weight: 600; color: #e6bfae;">No API key</span>
          <p style="margin: 0; font-size: 13px; line-height: 1.55; color: #b09287;"><span class="mono" style="color: #e6bfae;">GEMINI_API_KEY</span> is not set, so nothing can be generated.</p>
        </div>
      </div>
    </div>
  </section>

  <section style="padding: 20px 20px 0;">
    <span class="cap">Where to set it</span>
    <div style="margin-top: 11px; display: flex; flex-direction: column; gap: 10px;">

      <div style="background: #1a1c22; border: 1px solid #2a2d35; border-radius: 8px; padding: 14px 15px; display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 13px; font-weight: 500; color: #d5d9df;">On this phone</span>
        <p style="margin: 0; font-size: 12.5px; line-height: 1.5; color: #8d939d;">Add it as a Space secret named <span class="mono" style="color: #c3c8d0;">GEMINI_API_KEY</span>, then reload.</p>
      </div>

      <div style="background: #1a1c22; border: 1px solid #2a2d35; border-radius: 8px; padding: 14px 15px; display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 13px; font-weight: 500; color: #d5d9df;">Running locally</span>
        <div style="background: #101216; border: 1px solid #24272f; border-radius: 6px; padding: 10px 12px;">
          <span class="mono" style="font-size: 11.5px; line-height: 1.6; color: #9ba1ac;">GEMINI_API_KEY=your-key</span>
        </div>
        <p style="margin: 0; font-size: 12.5px; line-height: 1.5; color: #8d939d;">in <span class="mono" style="color: #c3c8d0;">.env</span> at the project root.</p>
      </div>

    </div>
  </section>

  <div style="flex-grow: 1;"></div>

  <section style="padding: 20px; display: flex; flex-direction: column; gap: 10px;">
    <div style="height: 48px; border-radius: 8px; border: 1px solid #3a3f49; background: #1c1e25; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 14.5px; font-weight: 500; color: #d5d9df;">Check again</span>
    </div>
    <div style="height: 52px; border-radius: 8px; background: #2a2620; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 15px; font-weight: 600; color: #6b6152;">Generate</span>
    </div>
  </section>

</div>
</x-dc>
</body>
</html>
