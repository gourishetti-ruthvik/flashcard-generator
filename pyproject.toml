[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flashcards"
version = "0.1.0"
description = "Convert study notes into Anki-importable flashcards using the Gemini API."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.20",
    "pydantic>=2.11",
    "typer>=0.15",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# torch and friends are ~26 packages / several GB, and are only needed for the
# dedupe stage. Kept optional so a plain install stays small.
dedupe = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
flashcards = "flashcards.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
